<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tesla 授权回调</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #262b36;
    --text: #e8eaed;
    --muted: #9aa3b2;
    --accent: #e82127;
    --ok: #35c46a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(1200px 600px at 80% -10%, #1c2029 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  main {
    width: min(620px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  p.hint { color: var(--muted); margin: 6px 0 22px; font-size: 13px; }
  .field { margin-bottom: 16px; }
  .label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--muted); letter-spacing: .6px;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .value {
    display: flex; gap: 8px; align-items: stretch;
  }
  code {
    flex: 1;
    min-width: 0;
    padding: 11px 12px;
    background: #0f1218;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    word-break: break-all;
    color: #d7e0ea;
    user-select: all;
  }
  button {
    flex: none;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #202531;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  button:hover { background: #272d3a; border-color: #3a4252; }
  button:active { transform: translateY(1px); }
  button.done { border-color: var(--ok); color: var(--ok); }
  .note {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
    color: var(--muted);
    font-size: 12.5px;
  }
  .warn { color: #f0b429; }
  .hidden { display: none; }
  ol { margin: 8px 0 0; padding-left: 18px; }
  li { margin: 2px 0; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="dot"></span><h1>Tesla 授权回调</h1></div>
  <p class="hint">此页面只把你浏览器地址栏里的参数显示出来，不发送任何网络请求，也不含统计脚本。</p>

  <div id="missing" class="field hidden">
    <div class="label"><span>状态</span></div>
    <code class="warn">地址里没有 code 参数。请从授权链接重新进入。</code>
  </div>

  <div id="results">
    <div class="field">
      <div class="label"><span>code</span><span id="codeLen"></span></div>
      <div class="value">
        <code id="code">—</code>
        <button id="copyCode" type="button">复制</button>
      </div>
    </div>

    <div class="field">
      <div class="label"><span>state</span></div>
      <div class="value">
        <code id="state">—</code>
        <button id="copyState" type="button">复制</button>
      </div>
    </div>

    <div id="err" class="field hidden">
      <div class="label"><span>授权服务器返回错误</span></div>
      <code id="errValue" class="warn"></code>
    </div>
  </div>

  <div class="note">
    <ol>
      <li>点 code 旁边的「复制」，粘回运行 <code style="display:inline;padding:2px 5px;border:0;background:#0f1218">authorize</code> 的终端。</li>
      <li>state 只用于核对本次授权，和终端里显示的一致才对。</li>
      <li>code 几分钟内有效，用一次就作废，别转发给任何人。</li>
    </ol>
  </div>
</main>

<script>
(function () {
  "use strict";
  var params = new URLSearchParams(window.location.search);
  var code = params.get("code") || "";
  var state = params.get("state") || "";
  var err = params.get("error") || "";
  var errDesc = params.get("error_description") || "";

  var codeEl = document.getElementById("code");
  var stateEl = document.getElementById("state");
  var results = document.getElementById("results");
  var errEl = document.getElementById("err");
  var errValue = document.getElementById("errValue");
  var missing = document.getElementById("missing");

  if (code) {
    codeEl.textContent = code;
    document.getElementById("codeLen").textContent = code.length + " 字符";
  } else {
    results.classList.add("hidden");
    missing.classList.remove("hidden");
  }
  stateEl.textContent = state || "（无）";

  if (err) {
    results.classList.add("hidden");
    missing.classList.remove("hidden");
    missing.querySelector("code").textContent = "授权服务器返回错误：" + err;
    errEl.classList.remove("hidden");
    errValue.textContent = err + (errDesc ? " — " + errDesc : "");
  }

  function flash(btn) {
    var original = btn.textContent;
    btn.textContent = "已复制";
    btn.classList.add("done");
    setTimeout(function () {
      btn.textContent = original;
      btn.classList.remove("done");
    }, 1600);
  }

  function fallbackCopy(text, btn) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.top = "-1000px";
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); } catch (e) { /* ignore */ }
    document.body.removeChild(area);
    if (btn) flash(btn);
  }

  function copy(text, btn) {
    if (!text) return;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { flash(btn); }, function () {
        fallbackCopy(text, btn);
      });
    } else {
      fallbackCopy(text, btn);
    }
  }

  document.getElementById("copyCode").addEventListener("click", function () {
    copy(code, this);
  });
  document.getElementById("copyState").addEventListener("click", function () {
    copy(state, this);
  });
})();
</script>
</body>
</html>
